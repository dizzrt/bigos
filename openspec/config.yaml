schema: spec-driven

context: |
  Project: BigOS, an early-stage x86_64 freestanding operating system kernel.

  Domain:
  - The repository is a toy/research OS kernel, not an application service.
  - The current runnable backend is x86_64 Legacy BIOS/MBR/exFAT. UEFI,
    multi-architecture backends, and SMP remain future or parallel tracks.
  - The kernel boots from an x86 disk image, enters long mode, loads an ELF64
    kernel named "kernel", and jumps to the higher-half kernel address
    0xffffffff80000000.
  - The current bounded userland baseline covers bootstrapping, VGA text and
    COM1 serial output, a kernel-owned IDT with exception/IRQ/syscall dispatch,
    i8259 PIC, PIT IRQ0 tick, keyboard TTY/console input, buddy/slab/kmalloc/
    virtual memory, direct map, owned empty page-table reclamation, a single-core
    scheduler, `int 0x80` syscall dispatch, process lifecycle, demand paging,
    bounded `fork`/COW, signals, time/identity, fd/VFS, pipe/dup, RAM-backed
    writable `/rw`, page/buffer cache, `execve`, default PID-1 init, minimal user
    crt0/libc, `/bin/sh`, packaged `/bin/*`, bounded POSIX-like process/I/O
    behavior, and behavior-oriented default-off runtime smokes.

  Tech stack:
  - C++17 and C17 in freestanding mode.
  - x86/x86_64 assembly for boot, interrupt stubs, context switching, and runtime
    startup objects.
  - xmake is the primary build system.
  - x86_64-elf-gcc is the expected cross toolchain.
  - QEMU and Bochs are supported for the current Legacy BIOS path.
  - Python scripts are auxiliary build/install helpers, not the core runtime.
  - Python-related commands should run through uv, for example `uv run pytest`,
    `uv run python <script>`, `uv run ruff check`, and `uv run pyright`.

  Major directories:
  - kernel/arch/x86/boot: MBR, exFAT DBR, extended DBR, long-mode boot code, and
    ELF loader.
  - kernel/core: kernel entry plus subsystem subdirectories: irq, timer, terminal,
    sched, syscall, proc, fs, ipc, signal, time, bigos, and string functions.
  - kernel/core/proc: process model, growable fd table, VMA/heap metadata,
    demand-zero/COW handling, `fork`, signals integration, ring3 entry, `execve`,
    PID-1 init launch, safe teardown/reaping, and bounded ELF64 loader.
  - kernel/core/fs: exFAT read path, RAM-backed `bigfs` mounted at `/rw`, VFS
    open/read/write/close/lseek/fsync, page/buffer cache, and bounded file IO.
  - kernel/mm: buddy physical page allocator with an early metadata arena,
    slab/kmalloc allocator, kernel virtual memory, kernel direct map, public
    memory API, and switchable memory runtime self-test.
  - kernel/drivers: VGA text-mode driver, i8259 PIC driver, PIT timer driver, and
    ATA PIO block driver.
  - kernel/runtime: startup objects such as crt0, crti, and crtn.
  - user: freestanding user crt0/libc, PID-1 init, `/bin/sh`, small `/bin/*`
    programs, and the default-off userland smoke.
  - tools: developer helper scripts such as boot_debug.py.
  - cpp: small kernel C++ support library, KTL containers, new/delete, and minimal
    libsupc++/ABI support.
  - include: public kernel headers and a small libc-style header subset.
  - docs: bilingual project documentation with docs/en canonical and docs/zh as
    the Simplified Chinese mirror.
  - tests: validation tests and local test assets.

  Current maturity:
  - The project has iterated from an early boot/kernel skeleton to a single-core
    bounded userland baseline.
  - Boot, VGA/serial output, kernel-owned IDT and exception/IRQ/syscall dispatch,
    PIC, PIT timer IRQ0, keyboard decode plus TTY/console input, buddy allocation,
    slab allocation, kernel virtual memory, owned empty page-table reclamation,
    and the kernel direct map are implemented and covered by switchable smokes or
    source-level checks.
  - A single-core round-robin scheduler with cooperative switching, wait queues,
    timeout sleep, preemption-disable depth, and guarded IRQ-return timer
    preemption is implemented.
  - The `int 0x80` syscall entry supports the bounded diagnostic/user ABI plus
    process wait/exit, fd/VFS open/read/write/close/lseek/fsync, pipe/dup, brk,
    restricted anonymous mapping, `fork`, time/identity, signals, mkdir/unlink,
    and `execve`.
  - Normal boot packages `/boot/user/init.elf`, `/bin/sh`, and bounded `/bin/*`,
    enters resident PID-1 init, and starts `/bin/sh`. Default-off smokes cover
    flat user program, filesystem-backed user ELF, demand paging, fork/COW,
    time/identity, signals, writable FS, pipe, and userland runtime markers.
  - Not yet implemented: SMP, a complete POSIX process/job-control model, broad
    file-backed `mmap`, dynamic linking/shared libraries, a complete POSIX libc,
    persistent full writable filesystems, async I/O, broad storage/device
    drivers, a runnable UEFI backend, and release-grade CI automation.
  - Some paths are scaffolding or TODOs. Inspect call sites before assuming a
    subsystem is wired into normal boot; optional smoke entry threads and runtime
    validation markers remain gated even when shared subsystems compile normally.

  Conventions:
  - Prefer small, explicit low-level code over abstractions that hide hardware
    details.
  - Keep kernel code freestanding-safe. Do not assume hosted libc, exceptions,
    RTTI, OS services, or dynamic initialization beyond what the project
    explicitly supports; `user/**` may use only the bounded freestanding libc
    implemented in this repository.
  - Preserve the current namespace style: bigos for kernel APIs, bigos::mm for
    memory management, bigos::irq for interrupts, driver::* for drivers, and ktl
    for kernel container utilities.
  - Use the explicit memory allocation API: alloc_kernel_pages(nr_pages, flags)
    for kernel virtual pages and the internal alloc_physical_order(order, flags)
    for buddy. Do not reintroduce removed mixed-semantics aliases.
  - Preserve the interrupt foundation: kernel-owned static IDT, stable
    InterruptFrame dispatch ABI, separation of CPU exceptions, remapped i8259
    IRQs, and the software syscall vector 0x80. The syscall path must never send
    an i8259 EOI. User `#PF` recovery is bounded to the implemented VMA-backed
    demand-zero/COW paths; unsupported kernel faults remain diagnostic/panic
    paths.
  - Validation/diagnostic features are gated by xmake switches (all default-off)
    and emit fixed COM1/VGA markers:
    mm_self_test, slab_debug, page_fault_smoke, timer_smoke, keyboard_smoke,
    scheduler_smoke, scheduler_semantics_smoke, blocking_smoke, user_vmem_smoke,
    syscall_smoke, user_program_smoke, fs_smoke, user_elf_smoke,
    demand_paging_smoke, fork_cow_smoke, time_identity_smoke, signal_smoke,
    writable_fs_smoke, pipe_smoke, and userland_smoke. The unified panic path
    emits BIGOS_PANIC code=<code> source=<source>.
  - Treat hardware constants, linker addresses, boot protocol addresses, and page
    table self-mapping addresses as design-critical. Explain changes to them.
  - Keep public headers minimal and include only what is needed.
  - Prefer ASCII in source and docs unless there is a clear reason otherwise.
  - For repository documentation, treat docs/en as canonical and keep docs/zh
    synchronized with matching relative Markdown paths. Documentation changes
    must use repository-relative paths and must not imply changes to boot
    addresses, linker addresses, IDT/syscall vectors, page-table layout, disk
    layout, CR3 switching, or kernel ABI.
  - Treat roadmap.md as a project-planning document only. It may describe
    implemented capabilities, missing capabilities, medium/long-term planning,
    and staged development priorities, but must not contain concrete entry
    points, file paths, commands, validation markers, source-level implementation
    details, or archive/version indexes.
  - OpenSpec change artifacts should use Chinese descriptions by default,
    including proposal, design, specs, tasks, validation notes, and documentation
    tasks. Preserve OpenSpec-required structural keywords when needed for tooling.

rules:
  proposal:
    - Use Chinese descriptions by default while preserving any structural
      headings required by OpenSpec tooling.
    - State which boot/kernel subsystem is affected.
    - Include non-goals for any OS feature that is intentionally out of scope.
    - Call out assumptions about architecture, memory layout, emulator, disk
      layout, and toolchain.
  design:
    - Use Chinese descriptions by default while preserving any structural
      headings required by OpenSpec tooling.
    - Include control flow or data flow when the change crosses boot, memory, IRQ,
      or driver boundaries.
    - Document any address layout, page-table, ABI, linker-script, or interrupt
      vector changes.
    - Describe failure behavior for low-level allocation, IO, and interrupt paths.
  specs:
    - Use Chinese requirement descriptions and scenario text by default, but keep
      OpenSpec operation headers and requirement/scenario markers parseable.
    - Requirements must be observable in the kernel, boot image, emulator output,
      or deterministic low-level behavior.
    - Avoid specifying hosted OS behavior unless the change explicitly introduces
      that layer.
  tasks:
    - Use Chinese task descriptions by default while preserving checkbox syntax.
    - Break work by subsystem and keep each task independently reviewable.
    - Match validation tasks to the change impact area, including build, static
      checks, emulator smoke test, or targeted low-level test where practical.
    - For runtime changes under kernel/core, kernel/mm, kernel/drivers, cpp, include,
      kernel/arch, or kernel/runtime, include the narrowest useful validation for the affected code path
      or explicitly record why the validation cannot run.
    - Call out manual setup needed for x86_64-elf-gcc, xmake, Bochs, or disk
      image paths.
    - For changes that add or modify C++ source, C++ headers, kernel C++ support,
      KTL code, or C++ build configuration, include clang and clangd auxiliary
      static-check tasks, or record why either tool is unavailable or not
      applicable.
    - For C++ changes, fix clang/clangd errors introduced by the current change
      before marking related implementation tasks complete, and confirm or fix
      valid new warnings. Validation notes must distinguish historical
      diagnostics, current-change diagnostics, and toolchain or freestanding
      configuration false positives.
    - >-
      Configure C++ auxiliary checks as close as practical to the GCC
      cross-build environment: freestanding C++17, x86_64 target, project
      include paths, no hosted runtime assumptions, no exceptions, and no RTTI.
      If equivalent clang or clangd flags are unavailable, document the gap and
      remaining risk.
    - Treat clang and clangd as auxiliary diagnostic signals only. They do not
      replace xmake with x86_64-elf-gcc/x86_64-elf-g++ or an equivalent targeted
      GCC cross-toolchain build for runtime C++ changes.
    - For boot, linker, handoff, page-table, or address-layout changes, include
      bootability, ABI/layout compatibility, and address-assumption review tasks.
    - For buddy, slab, kmalloc, virtual memory, or early memory initialization
      changes, include initialization-order, allocation-phase, object-lifetime,
      alignment, and failure-behavior review tasks.
    - For IRQ, PIC, port IO, MMIO, or driver-state changes, include interrupt
      safety, reentrancy, hardware-access ordering, and visible-failure review
      tasks.
    - Validation records must separate checks that passed, checks that could not
      run with reasons and remaining risk, historical diagnostics, and issues
      introduced by the current change.
    - For any Python-related execution or validation, describe commands through
      `uv run ...` by default. This includes pytest, Python helper scripts,
      linting, formatting, type checks, and ad-hoc Python commands. If `uv` is
      unavailable, tasks must say to record that blocker explicitly instead of
      silently using system Python.
    - For changes that add or modify Python files, include tasks to run
      `uv run ruff check`, `uv run ruff format --check`, `uv run pyright`, and
      `uv run pytest`.
    - During implementation, fix newly introduced Python lint errors, type
      diagnostics, test failures, and formatting inconsistencies before marking
      Python-related tasks complete.
    - Do not require Python validation tasks for changes that do not add or
      modify Python files unless Python tooling is otherwise relevant.
